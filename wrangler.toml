name = "studios-miau-site"
main = "src/worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
# o Worker só roda nestes caminhos; o resto é servido direto como arquivo
run_worker_first = ["/", "/api/*", "/p/*", "/b/*"]
